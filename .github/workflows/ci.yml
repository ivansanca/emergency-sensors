name: CI

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar, tests y SonarCloud
    if: github.event_name != 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'development'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y ejecutar tests
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Analizar con SonarQube Cloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn --batch-mode --no-transfer-progress
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.organization=ivansanca
          -Dsonar.projectKey=emergency-sensors
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.qualitygate.wait=true

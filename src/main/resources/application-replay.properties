# Perfil "replay": reproduce los focos de FIRMS del 21-22/03/2026 por toda la cadena.
# Se activa con --spring.profiles.active=replay. La clave sigue saliendo de FIRMS_MAP_KEY.

sensors.ingestion.enabled=true

# Dos dias desde el 21/03/2026 (FIRMS devuelve de date a date + day-range - 1)
sensors.firms.date=2026-03-21
sensors.firms.day-range=2

# En marzo de 2026 no hay datos NRT: solo los de calidad estandar (SP), que FIRMS
# publica con meses de retraso. Los tres satelites VIIRS cubren esas fechas.
sensors.firms.datasets=VIIRS_SNPP_SP,VIIRS_NOAA20_SP,VIIRS_NOAA21_SP

# Sin limite de antiguedad: los focos son de hace meses y el detector los descartaria todos
sensors.detector.max-age=

spring.application.name=emergency-sensors

# 8080 lo usa emergency-management y 8081 Redpanda Console
server.port=8082

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Si Kafka no responde, fallar a los 5 s en lugar de bloquearse 60 s
spring.kafka.producer.properties.max.block.ms=5000
# Kafka abandona un envio a los 8 s, antes de que los publicadores dejen de esperar (10 s).
# delivery.timeout.ms no puede ser menor que linger.ms + request.timeout.ms
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=8000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Un grupo de consumidores nuevo empieza por el principio del topic: no se pierden focos ya publicados
spring.kafka.consumer.auto-offset-reset=earliest
# Lotes pequenos: cada foco aceptado espera la confirmacion de Kafka antes de seguir
spring.kafka.consumer.max-poll-records=50
# No arrancar si no se pueden crear los topics. Solo protege el arranque: si se borra un topic
# en caliente, un broker con auto.create.topics.enable=true lo vuelve a crear con 1 particion
spring.kafka.admin.fail-fast=true
# Maximo de detectores que pueden repartirse el trabajo
sensors.kafka.hotspot-partitions=6

# Ingesta de NASA FIRMS. Desactivada por defecto: solo una instancia debe consultar la API.
sensors.ingestion.enabled=false
# La clave sale de la variable de entorno FIRMS_MAP_KEY; sin ella no se consulta FIRMS
sensors.firms.map-key=${FIRMS_MAP_KEY:}
sensors.firms.base-url=https://firms.modaps.eosdis.nasa.gov
# S-NPP no publica datos NRT desde el 02/11/2026 (responde 200 sin focos)
sensors.firms.datasets=VIIRS_NOAA20_NRT,VIIRS_NOAA21_NRT
# Rectangulo oeste,sur,este,norte alrededor de Cantabria
sensors.firms.area=-4.95,42.65,-3.05,43.60
# 2 dias: con 1 solo llega el dia UTC en curso y se pierden los focos de la noche anterior
sensors.firms.day-range=2
sensors.firms.initial-delay=PT5S
sensors.firms.poll-interval=PT15M
sensors.firms.connect-timeout=PT10S
sensors.firms.read-timeout=PT60S
sensors.firms.sent-cache-ttl=PT48H

# Detector de incendios. Activo por defecto: cualquier numero de instancias puede ejecutarlo
# (hasta el numero de particiones del topic de focos)
sensors.detector.enabled=true
# Confianza VIIRS: l (baja), n (nominal), h (alta). Los focos de confianza baja se descartan
sensors.detector.accepted-confidences=n,h
# Se descartan los focos observados hace mas tiempo. Vacio = sin limite (reproduccion de datos historicos)
sensors.detector.max-age=PT24H
# Recintos municipales del IGN (BDLJE, CC BY 4.0): 102 municipios y la Comunidad de Campoo y Cabuerniga
sensors.detector.municipalities=classpath:geo/cantabria-municipios.geojson
# Fuentes de calor fijas: se descartan los focos a menos de radius-meters del centro.
# Provisional: centrada en el foco nocturno del 22/11/2026 junto a la aceria de Nueva Montana.
# La lista definitiva saldra de un ano de datos SP de FIRMS (focos con type=2).
# Los acentos de los nombres van como escapes unicode porque este fichero se lee en ISO-8859-1
sensors.detector.static-heat-sources[0].name=Acer\u00eda de Nueva Monta\u00f1a (Santander)
sensors.detector.static-heat-sources[0].latitude=43.44348
sensors.detector.static-heat-sources[0].longitude=-3.84716
sensors.detector.static-heat-sources[0].radius-meters=1000

# El log de peticiones del HttpClient del JDK escribe la URL, que lleva la MAP_KEY
logging.level.jdk.httpclient.HttpClient=OFF

# metrics: hora de la ultima consulta correcta a FIRMS (sensors.firms.last.success)
# y focos evaluados por el detector (sensors.detector.hotspots)
management.endpoints.web.exposure.include=health,metrics

spring.application.name=emergency-sensors

# 8080 lo usa emergency-management y 8081 Redpanda Console
server.port=8082

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Si Kafka no responde, fallar a los 5 s en lugar de bloquearse 60 s
spring.kafka.producer.properties.max.block.ms=5000
# Kafka abandona un envio a los 8 s, antes de que HotspotPublisher deje de esperar (10 s).
# delivery.timeout.ms no puede ser menor que linger.ms + request.timeout.ms
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=8000
# No arrancar si no se pueden crear los topics. Solo protege el arranque: si se borra un topic
# en caliente, un broker con auto.create.topics.enable=true lo vuelve a crear con 1 particion
spring.kafka.admin.fail-fast=true
# Maximo de detectores que pueden repartirse el trabajo
sensors.kafka.hotspot-partitions=6

# Ingesta de NASA FIRMS. Desactivada por defecto: solo una instancia debe consultar la API.
sensors.ingestion.enabled=false
# La clave sale de la variable de entorno FIRMS_MAP_KEY; sin ella no se consulta FIRMS
sensors.firms.map-key=${FIRMS_MAP_KEY:}
sensors.firms.base-url=https://firms.modaps.eosdis.nasa.gov
# S-NPP no publica datos NRT desde el 02/11/2026 (responde 200 sin focos)
sensors.firms.datasets=VIIRS_NOAA20_NRT,VIIRS_NOAA21_NRT
# Rectangulo oeste,sur,este,norte alrededor de Cantabria
sensors.firms.area=-4.95,42.65,-3.05,43.60
# 2 dias: con 1 solo llega el dia UTC en curso y se pierden los focos de la noche anterior
sensors.firms.day-range=2
sensors.firms.initial-delay=PT5S
sensors.firms.poll-interval=PT15M
sensors.firms.connect-timeout=PT10S
sensors.firms.read-timeout=PT60S
sensors.firms.sent-cache-ttl=PT48H

# El log de peticiones del HttpClient del JDK escribe la URL, que lleva la MAP_KEY
logging.level.jdk.httpclient.HttpClient=OFF

# metrics: hora de la ultima consulta correcta a FIRMS (sensors.firms.last.success)
management.endpoints.web.exposure.include=health,metrics
